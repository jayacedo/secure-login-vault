<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secure Login Vault</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-32.png" alt="" width="28" height="28" />
        <h1>Secure Login Vault</h1>
      </header>

      <section id="status" class="status" data-state="checking" role="status" aria-live="polite">
        <strong id="status-title">Checking...</strong>
        <p id="status-detail"></p>
      </section>

      <section id="site" class="site" hidden>
        <h2 id="site-title"></h2>
        <ul id="logins" class="logins"></ul>
        <p id="fill-note" class="note" role="status" aria-live="polite"></p>
        <p id="site-note" class="note"></p>
      </section>

      <section id="save" class="site" hidden>
        <h2>Save a login</h2>
        <p class="note">Type your username and password on the page, then press Save. You confirm in Secure Login Vault.</p>
        <button id="save-button" type="button">Save this login</button>
        <p id="save-note" class="note" role="status" aria-live="polite"></p>
      </section>

      <section id="pairing" class="pairing" hidden>
        <label for="code">Pairing code</label>
        <input id="code" type="text" autocomplete="off" spellcheck="false" maxlength="60" placeholder="Paste the code from the app" />
        <button id="pair" type="button">Pair</button>
      </section>

      <button id="recheck" type="button">Check again</button>
      <button id="forget" class="quiet" type="button" hidden>Forget pairing</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

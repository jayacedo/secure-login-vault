<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLV reviewer test - dummy credentials only</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 20px; }
  label { display: block; margin: 20px 0 6px; }
  input { box-sizing: border-box; width: 100%; padding: 12px; font: inherit; }
  button { margin: 20px 8px 0 0; padding: 10px 16px; font: inherit; }
</style>
<h1>SLV reviewer test</h1>
<p>Use dummy credentials only. This page does not submit, log or store them.</p>
<form id="login" method="post">
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Simulate sign-in</button>
  <button type="reset">Clear fields</button>
</form>
<p id="status" role="status"></p>
<script>
  document.getElementById('login').addEventListener('submit', event => {
    event.preventDefault();
    document.getElementById('status').textContent = 'Submit event received. Nothing was sent or stored.';
  });
  document.getElementById('login').addEventListener('reset', () => {
    document.getElementById('status').textContent = '';
  });
</script>
</html>
